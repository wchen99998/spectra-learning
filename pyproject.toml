[project]
name = "spectra-learning"
version = "0.1.0"
description = "Self-supervised representation learning for mass spectrometry peak sets"
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "huggingface-hub>=0.33.2",
    "numpy>=2.1.0",
    "pyarrow>=16.0.0",
    "google-cloud-storage>=2.14.0",
    "h5py>=3.11.0",
    "matplotlib>=3.10.3",
    "ml-collections>=1.1.0",
    "rdkit>=2025.3.3",
    "scikit-learn>=1.8.0",
    "tqdm>=4.66.4",
    "wandb==0.27.0",
    "jaxtyping>=0.3.10",
    "fsspec>=2026.1.0",
    "gcsfs>=2026.1.0",
    "pyteomics[xml]>=5.0",
    "PyYAML>=6.0.0",
    "myopic-mces>=1.1.1",
    "pulp>=2.9",
]

[project.optional-dependencies]
cuda = [
    "torch==2.12.0; sys_platform == 'linux'",
    "jax[cuda13]>=0.11.0; sys_platform == 'linux'",
    "flax>=0.12.7",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.0",
]
tpu = [
    "torch==2.12.0; sys_platform == 'linux'",
    "jax[tpu]>=0.11.0; sys_platform == 'linux'",
    "flax>=0.12.7",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-cpu", extra = "tpu" },
]

[tool.uv]
constraint-dependencies = [
    "jax>=0.11.0",
    "jaxlib>=0.11.0",
]
conflicts = [
    [
        { extra = "cuda" },
        { extra = "tpu" },
    ],
]

[dependency-groups]
dev = [
    "pyrefly==1.0.0",
    "pytest>=9.0.3",
    "types-tqdm>=4.67.3.20260508",
]
