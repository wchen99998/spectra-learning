[project]
name = "spectra-learning"
version = "0.1.0"
description = "Self-supervised representation learning for mass spectrometry peak sets"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "hf-xet>=1.6.0",
    "huggingface-hub>=1.27.0",
    "numpy>=2.5.2",
    "pyarrow>=25.0.1",
    "google-cloud-storage>=3.13.1",
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "ml-collections>=1.1.0",
    "rdkit>=2026.3.5",
    "scikit-learn>=1.9.0",
    "tqdm>=4.70.0",
    "wandb==0.28.2",
    "jaxtyping>=0.3.11",
    "fsspec>=2026.7.0",
    "gcsfs>=2026.7.0",
    "PyYAML>=6.0.3",
    "myopic-mces>=1.2.2",
    "pulp>=3.3.2",
]

[project.optional-dependencies]
cuda = [
    "torch==2.13.0; sys_platform == 'linux'",
    "jax[cuda13]>=0.11.0; sys_platform == 'linux'",
    "flax>=0.12.8",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.4",
]
tpu = [
    "torch==2.13.0; sys_platform == 'linux'",
    "jax[tpu]>=0.11.0; sys_platform == 'linux'",
    "flax>=0.12.8",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.4",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-cpu", extra = "tpu" },
]

[tool.uv]
constraint-dependencies = [
    "jax>=0.11.0",
    "jaxlib>=0.11.0",
]
conflicts = [
    [
        { extra = "cuda" },
        { extra = "tpu" },
    ],
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "types-tqdm>=4.70.0.20260805",
]
